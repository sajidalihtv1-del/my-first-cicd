name: Test Website

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: |
          test -f index.html
          echo "index.html found successfully!"

      - name: Check HTML content
        run: |
          grep -q "<html" index.html
          grep -q "<h1>" index.html
          echo "HTML structure check passed!"

      - name: Test successful
        run: echo "All website tests passed!"