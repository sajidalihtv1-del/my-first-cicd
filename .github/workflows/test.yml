name: Test Website

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check index.html
        run: |
          test -f index.html
          echo "index.html found successfully!"

      - name: Test successful
        run: echo "Website test passed!"